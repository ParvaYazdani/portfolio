<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="350" viewBox="0 0 1120 350" font-family="'DejaVu Sans', Verdana, sans-serif">
  <!-- UML activity diagram: Contract Manager Agent pipeline.
       Styled like the Project Management Framework diagrams (PlantUML defaults):
       #F1F1F1 fills, #181818 strokes, black bold DejaVu Sans 14 for node text, 11 for labels. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#181818"/>
    </marker>
  </defs>

  <rect width="1120" height="350" fill="#FFFFFF"/>

  <!-- Swimlanes (activity partitions), titles top-left as in PlantUML -->
  <rect x="10" y="10" width="1100" height="330" fill="none" stroke="#000000" stroke-width="1.5"/>
  <line x1="10" y1="190" x2="1110" y2="190" stroke="#000000" stroke-width="1.5"/>
  <text x="20" y="31" font-size="14" font-weight="bold" fill="#000000">Deterministic</text>
  <text x="20" y="211" font-size="14" font-weight="bold" fill="#000000">Local LLM</text>

  <!-- Control and object flows -->
  <g stroke="#181818" stroke-width="1" fill="none" marker-end="url(#arrow)">
    <line x1="47" y1="105" x2="69" y2="105"/>
    <line x1="75" y1="72" x2="97" y2="72"/>
    <line x1="75" y1="138" x2="97" y2="138"/>
    <line x1="282" y1="72" x2="304" y2="72"/>
    <line x1="282" y1="138" x2="304" y2="138"/>
    <line x1="310" y1="105" x2="332" y2="105"/>
    <line x1="477" y1="105" x2="499" y2="105"/>
    <line x1="591.5" y1="125" x2="591.5" y2="220"/>
    <line x1="591.5" y1="230" x2="591.5" y2="250"/>
    <line x1="674" y1="270" x2="709" y2="270"/>
    <path d="M719,270 H820 V125"/>
    <line x1="900" y1="105" x2="922" y2="105"/>
    <line x1="1047" y1="105" x2="1069" y2="105"/>
  </g>

  <!-- Initial node -->
  <circle cx="37" cy="105" r="10" fill="#222222"/>

  <!-- Fork and join nodes -->
  <rect x="69" y="45" width="6" height="120" fill="#555555"/>
  <rect x="304" y="45" width="6" height="120" fill="#555555"/>

  <!-- Object nodes: inputs -->
  <g font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">
    <rect x="97" y="50" width="185" height="44" fill="#F1F1F1" stroke="#181818" stroke-width="0.5"/>
    <text x="189.5" y="68">Template contract</text>
    <text x="189.5" y="86">[.docx]</text>

    <rect x="97" y="116" width="185" height="44" fill="#F1F1F1" stroke="#181818" stroke-width="0.5"/>
    <text x="189.5" y="134">Target contract</text>
    <text x="189.5" y="152">[.docx]</text>

    <!-- Actions -->
    <rect x="332" y="85" width="145" height="40" rx="12.5" ry="12.5" fill="#F1F1F1" stroke="#181818" stroke-width="0.5"/>
    <text x="404.5" y="110">Parse clauses</text>

    <rect x="499" y="85" width="185" height="40" rx="12.5" ry="12.5" fill="#F1F1F1" stroke="#181818" stroke-width="0.5"/>
    <text x="591.5" y="110">Match to template</text>

    <rect x="509" y="250" width="165" height="40" rx="12.5" ry="12.5" fill="#F1F1F1" stroke="#181818" stroke-width="0.5"/>
    <text x="591.5" y="275">Evaluate clause</text>

    <rect x="740" y="85" width="160" height="40" rx="12.5" ry="12.5" fill="#F1F1F1" stroke="#181818" stroke-width="0.5"/>
    <text x="820" y="110">Aggregate risk</text>

    <!-- Object node: output -->
    <rect x="922" y="83" width="125" height="44" fill="#F1F1F1" stroke="#181818" stroke-width="0.5"/>
    <text x="984.5" y="101">Report</text>
    <text x="984.5" y="119">[UI, .docx]</text>
  </g>

  <!-- Expansion region: one LLM call per clause -->
  <rect x="489" y="225" width="225" height="95" rx="12.5" ry="12.5" fill="none" stroke="#181818" stroke-width="1" stroke-dasharray="5 3"/>

  <!-- Input expansion node (clauses) on the top border, output expansion node (findings) on the right border -->
  <g fill="#F1F1F1" stroke="#181818" stroke-width="1">
    <rect x="576.5" y="220" width="10" height="10"/>
    <rect x="586.5" y="220" width="10" height="10"/>
    <rect x="596.5" y="220" width="10" height="10"/>
    <rect x="709" y="255" width="10" height="10"/>
    <rect x="709" y="265" width="10" height="10"/>
    <rect x="709" y="275" width="10" height="10"/>
  </g>

  <g font-size="11" fill="#000000">
    <text x="497" y="242">«iterative»</text>
    <text x="612" y="242">clauses</text>
    <text x="725" y="303">findings</text>
  </g>

  <!-- Activity final node -->
  <circle cx="1081" cy="105" r="11" fill="none" stroke="#222222" stroke-width="1.5"/>
  <circle cx="1081" cy="105" r="6" fill="#222222"/>
</svg>
